<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build viewer: see it before you buy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family:Inter; font-style:normal; font-weight:100 900; font-display:block; src:url(/fonts/Inter.woff2) format("woff2"); }
  :root { --bg:#dde3ea; --ink:#1b2430; --side:#f6f8fa; --line:#c5cdd6; --acc:#1f6feb; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:Inter, system-ui, sans-serif; color:var(--ink); font-size:14px; }
  #app { display:flex; height:100vh; }
  #side { width:310px; flex:none; background:var(--side); border-right:1px solid var(--line); overflow-y:auto; padding:12px; }
  #side h1 { font-size:16px; margin:0 0 8px; }
  .tabs { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:6px; padding:7px 10px; cursor:pointer; color:var(--ink); }
  button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .row { display:flex; gap:6px; margin:6px 0; flex-wrap:wrap; }
  .row > button { flex:1; }
  .intro { font-size:13px; line-height:1.35; margin:6px 0 10px; color:#37424f; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#9aa6b4; margin:14px 0 4px; }
  label.chk { display:flex; align-items:flex-start; gap:6px; padding:2px 0; font-size:13px; line-height:1.25; cursor:pointer; }
  label.chk input { margin-top:2px; }
  .partrow:hover { background:#e6eefb; }
  .hint { font-size:12px; color:#9aa6b4; margin-top:10px; line-height:1.35; }
  #main { position:relative; flex:1; min-width:0; overflow:hidden; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lbl { background:rgba(255,255,255,.92); color:#111; font-size:11px; font-weight:600; padding:1px 5px; border-radius:4px; border:1px solid #9aa6b4; white-space:nowrap; transform:translate(-50%,-100%); }
  .lbl.pt { background:#fff3c4; border-color:#caa41f; }
  .tick { font-size:10px; color:#334; background:none; border:none; padding:0; font-weight:600; }
  #card { position:absolute; left:12px; bottom:12px; width:360px; max-width:calc(100% - 24px); background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; box-shadow:0 4px 18px rgba(0,0,0,.15); font-size:13px; line-height:1.35; display:none; z-index:5; }
  #card h3 { margin:0 0 4px; font-size:15px; }
  #card .k { color:#9aa6b4; font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-top:6px; }
  #card .src { word-break:break-word; font-size:12px; }
  #size4 { position:absolute; right:12px; top:12px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:14px; z-index:4; display:none; }
  #size4 b { font-size:16px; }
  #size4 { max-width:400px; }
  table.cmp { border-collapse:collapse; margin-top:8px; font-size:12px; width:100%; }
  table.cmp td, table.cmp th { border:1px solid var(--line); padding:2px 6px; text-align:left; }
  table.cmp td.me { background:#e6eefb; font-weight:700; }
  #scalehint { position:absolute; right:12px; bottom:10px; font-size:12px; color:#3d4958; background:rgba(255,255,255,.8); padding:2px 8px; border-radius:6px; z-index:3; }
  #panel { position:absolute; top:0; right:0; bottom:0; width:74%; background:#fff; border-left:2px solid var(--line); z-index:6; display:none; overflow:auto; }
  #panel .bar { position:sticky; top:0; background:#fff; padding:8px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-weight:600; z-index:2; }
  #panel svg { width:100%; height:auto; display:block; }
  #road { position:absolute; top:0; right:0; bottom:0; width:74%; background:#fff; border-left:2px solid var(--line); z-index:7; display:none; overflow:auto; }
  #road .bar { position:sticky; top:0; background:#fff; padding:8px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-weight:600; }
  #roadBody { padding:14px 18px; max-width:760px; }
  .rstep { display:flex; gap:12px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:14px; line-height:1.4; }
  .rnum { flex:none; width:30px; height:30px; border-radius:50%; background:var(--acc); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .rstep h3 { margin:0 0 4px; font-size:16px; }
  .rstep .no { color:#a33; font-weight:600; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:10px; margin-top:4px; }
  .badge.nb { background:#fde8e8; color:#a33; } .badge.rb { background:#e0f3e4; color:#1a6b34; }
  #err { display:none; position:absolute; top:0; left:0; right:0; background:#fee; color:#900; z-index:99; padding:6px; font-size:12px; }

  /* Dark look, same as the landing page */
  :root { --bg:#000; --ink:#f5f5f7; --side:#0b0b0c; --line:#2c2c2e; --acc:#2997ff; }
  html, body { background:#000; font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em; }
  button { background:#1c1c1e; color:#f5f5f7; border-radius:980px; border-color:#2c2c2e; }
  button:hover { border-color:#2997ff; }
  button.on { background:#0071e3; border-color:#0071e3; color:#fff; }
  .intro { color:#a1a1a6; } h2, .hint { color:#a1a1a6; }
  .partrow:hover { background:#1c1c1e; }
  #side { scrollbar-color:#3a3a3c #0b0b0c; }
  .lbl { background:rgba(28,28,30,.92); color:#f5f5f7; border-color:#48484a; }
  .lbl.pt { background:#3a2f0a; border-color:#a8841c; color:#ffe9a8; }
  .tick { color:#a1a1a6; }
  #card, #size4 { background:rgba(22,22,24,.94); color:#f5f5f7; border-color:#2c2c2e; backdrop-filter:blur(14px); }
  #card .k { color:#a1a1a6; }
  table.cmp td.me { background:#0a2a4d; }
  #scalehint { color:#a1a1a6; background:rgba(22,22,24,.8); }
  #panel, #road { background:#f5f5f7; color:#1d1d1f; border-left-color:#2c2c2e; }
  #panel .bar, #road .bar { background:#f5f5f7; color:#1d1d1f; }
  #panel button, #road button { background:#fff; color:#1d1d1f; border-color:#c5cdd6; }
  .rstep { background:#fff; }

  /* Minimal controls */
  #side { width:260px; padding:16px 14px; }
  .seg { display:flex; background:#1c1c1e; border-radius:980px; padding:3px; margin-bottom:10px; gap:2px; }
  .seg button { flex:1; border:0; background:transparent; padding:7px 4px; font-size:13px; color:#a1a1a6; }
  .seg button.on { background:#2c2c2e; color:#fff; }
  .seg button:hover { color:#fff; }
  button.wide { width:100%; font-size:13px; }
  #side h2 { margin:18px 0 6px; }
  #size4 { left:14px; right:auto; top:auto; bottom:14px; border-radius:980px; padding:7px 14px; font-size:13px; }
  #size4 b { font-size:14px; } #size4 .u { color:#a1a1a6; }
  #scalehint { right:14px; bottom:14px; }
  #card { left:auto; right:14px; bottom:auto; top:14px; }

  @media (max-width:700px) {
    #app { flex-direction:column; }
    #main { order:0; flex:none; height:52%; }
    #side { order:1; width:100%; flex:1; border-right:0; border-top:1px solid var(--line); }
    #card { max-width:calc(100% - 28px); width:300px; }
    #scalehint { display:none; }
    #panel, #road { width:100%; }
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { P, BB, hole, stage3, stage4, COMPARE, sizeText } from './parts.js';
// One font: canvas text needs Inter loaded before any texture is drawn.
try { await Promise.all([400, 600, 700, 800].map((w) => document.fonts.load(`${w} 20px Inter`))); } catch (e) {}
let DEV = stage4.dev, PCBL = stage4.pcbl, PLMAP = {}; // current device (set per stage)
const useDev = (def) => { if (def.dev) { DEV = def.dev; PCBL = def.pcbl; PLMAP = Object.fromEntries(PCBL.parts.map((p) => [p.id, p])); } };

const errBox = document.getElementById('err');
const errors = [];
function logErr(m) { errors.push(String(m)); errBox.style.display = 'block'; errBox.textContent = errors.join(' | '); document.body.dataset.errors = errors.join(' | '); }
window.addEventListener('error', (e) => logErr(e.message));
window.addEventListener('unhandledrejection', (e) => logErr(e.reason));

// ------------------------------------------------------------------ helpers
const isDev = (n) => n >= 4;
let CUR = 3; // stage being built (builders look at this)
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: o.r ?? 0.55, metalness: (o.m ?? 0) * 0.3, transparent: o.op !== undefined, opacity: o.op ?? 1 });
const METAL = '#b9bec7', GOLD = '#d4af37';
function box(w, h, d, color, o = {}) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, o)); return m; }
function cyl(r, len, axis, color, o = {}) {
  const g = new THREE.CylinderGeometry(r, o.r2 ?? r, len, o.seg ?? 24);
  if (axis === 'z') g.rotateX(Math.PI / 2); else if (axis === 'x') g.rotateZ(Math.PI / 2);
  return new THREE.Mesh(g, mat(color, o));
}
function canvasTex(wpx, hpx, draw) {
  const c = document.createElement('canvas'); c.width = wpx; c.height = hpx;
  const x = c.getContext('2d'); draw(x, c);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function plane(tex, w, l, face) { // face: 'y' (up), 'z' (front), '-z' (back)
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: .7, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  if (face === 'y') m.rotation.x = -Math.PI / 2; else if (face === '-z') m.rotation.y = Math.PI;
  return m;
}
function textLines(lines, wmm, lmm, fontMm, fg = '#e8e8ee', bg = null) {
  const S = 60; const W = Math.round(wmm * S), H = Math.round(lmm * S);
  return canvasTex(W, H, (x) => {
    if (bg) { x.fillStyle = bg; x.fillRect(0, 0, W, H); }
    x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `bold ${fontMm * S}px Inter, system-ui, sans-serif`;
    const lh = fontMm * S * 1.2; const y0 = H / 2 - (lines.length - 1) * lh / 2;
    lines.forEach((t, i) => x.fillText(t, W / 2, y0 + i * lh, W * 0.95));
  });
}
// top face of a part: stage 3 = up (+y), stage 4 = back side (-z)
function topFace(p, tex, sw = 0.92, sl = 0.92) {
  const [sx, sy, sz] = p.size;
  if (CUR === 3) { const m = plane(tex, sx * sw, sz * sl, 'y'); m.position.y = sy / 2 + 0.01; return m; }
  const m = plane(tex, sx * sw, sy * sl, '-z'); m.position.z = -sz / 2 - 0.01; return m;
}
const G = (...c) => { const g = new THREE.Group(); c.flat().forEach((x) => x && g.add(x)); return g; };
const at = (m, x, y, z) => { m.position.set(x, y, z); return m; };
function roundRectShape(w, h, r) {
  const s = new THREE.Shape(); const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0, false);
  s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2, false);
  s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, 1.5 * Math.PI, false);
  return s;
}
function extrudeRing(outerW, outerH, outerR, holeW, holeH, holeR, depth, color, o = {}) {
  const s = roundRectShape(outerW, outerH, outerR);
  if (holeW) s.holes.push(roundRectShape(holeW, holeH, holeR));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 10 });
  return new THREE.Mesh(g, mat(color, o));
}

// pad shapes (front-view coordinates, relative to part centre). Used by the 3D board texture AND the 2D drawing.
function padsOf(p) {
  const out = [];
  const add = (x, y, w, h, t) => out.push({ x, y, w, h, t });
  switch (p.kind) {
    case 'artemis':
      for (let k = 0; k < 12; k++) { const y = (k - 5.5) * 1.27; add(-4.75, y, 1.0, 0.7); add(4.75, y, 1.0, 0.7); }
      for (let k = 0; k < 7; k++) add((k - 3) * 1.27, -7.25, 0.7, 1.0);
      break;
    case 'qfn':
      add(0, 0, 3.15, 3.15);
      for (let k = 0; k < 7; k++) { const o = (3 - k) * 0.5; add(-2.35, o, 0.8, 0.25); add(2.35, o, 0.8, 0.25); add(-o, 2.35, 0.25, 0.8); add(-o, -2.35, 0.25, 0.8); }
      break;
    case 'inductor': add(-0.95, 0, 0.9, 2.1); add(0.95, 0, 0.9, 2.1); break;
    case 'p0603': { const lo = Math.max(p.w, p.h) / 2, sh = Math.min(p.w, p.h) + 0.15; if (p.w >= p.h) { add(-lo, 0, 0.8, sh); add(lo, 0, 0.8, sh); } else { add(0, -lo, sh, 0.8); add(0, lo, sh, 0.8); } break; }
    case 'rcfg': for (let k = 0; k < p.n; k++) { const cx = (k - (p.n - 1) / 2) * p.pitch; add(cx - 0.5, 0, 0.5, 0.6); add(cx + 0.5, 0, 0.5, 0.6); } break;
    case 'jack': add(-2.2, 7.2, 1.2, 1.6, 'T'); add(2.2, 7.2, 1.2, 1.6, 'R1'); add(-2.2, 3.4, 1.2, 1.6, 'R2'); add(2.2, 3.4, 1.2, 1.6, 'S'); add(-3.0, -3, 1.0, 1.6); add(3.0, -3, 1.0, 1.6); add(-3.0, -9, 1.0, 1.6); add(3.0, -9, 1.0, 1.6); break;
    case 'button': add(-0.7, 1.3, 1.0, 0.8); add(-0.7, -1.3, 1.0, 0.8); add(0.7, 1.3, 0.8, 0.8); add(0.7, -1.3, 0.8, 0.8); break;
    case 'pcm': add(4.7, 0.6, 1.4, 1.0); add(4.7, -1.0, 1.4, 1.0); break;
    case 'tantB': add(0, -1.5, 2.2, 1.0); add(0, 1.5, 2.2, 1.0); break;
    case 'p0402': add(-0.45, 0, 0.5, 0.6); add(0.45, 0, 0.5, 0.6); break;
    case 'wson': add(0, 0, 4.0, 3.4); for (let k = 0; k < 4; k++) { const y = (k - 1.5) * 1.27; add(-2.6, y, 0.8, 0.5); add(2.6, y, 0.8, 0.5); } break;
    case 'msop': for (let k = 0; k < 5; k++) { const y = (k - 2) * 0.5; add(-2.2, y, 0.9, 0.3); add(2.2, y, 0.9, 0.3); } break;
    case 'usbc': [0.2, 1.8, -2.2, 3.0, 4.2].forEach((x) => add(x, -2.0, 0.5, 1.0)); add(-4.0, 0.3, 0.8, 1.6); add(4.0, 0.3, 0.8, 1.6); break;
    case 'coin': add(-9.5, 0, 2.5, 3.0); add(9.5, 0, 2.5, 3.0); break;
  }
  if (p.rot === 90) return out.map((q) => ({ x: -q.y, y: q.x, w: q.h, h: q.w, t: q.t }));
  return out;
}

// draw one PCB face into a canvas context (3D texture). side 'b' = parts side seen from behind, 'f' = solar side.
function drawPcbFace(x, side, S) {
  const w = PCBL.w, h = PCBL.h;
  const X = (px) => (side === 'b' ? (w / 2 - px) : (w / 2 + px)) * S, Y = (py) => (h / 2 - py) * S;
  x.lineCap = 'round'; x.lineJoin = 'round';
  x.strokeStyle = '#c98f3c'; x.lineWidth = 0.35 * S;
  if (!EMBED) PCBL.traces.filter((t) => t.layer === side).forEach((t) => { x.beginPath(); t.pts.forEach((q, i) => (i ? x.lineTo(X(q[0]), Y(q[1])) : x.moveTo(X(q[0]), Y(q[1])))); x.stroke(); });
  x.fillStyle = '#e0b840';
  const rect = (cx, cy, pw, ph) => x.fillRect(X(cx) - pw * S / 2, Y(cy) - ph * S / 2, pw * S, ph * S);
  PCBL.parts.filter((p) => (p.side === 'f') === (side === 'f')).forEach((p) => padsOf(p).forEach((q) => rect(p.x + q.x, p.y + q.y, q.w, q.h)));
  if (side === 'f') PCBL.frontPads.forEach((q) => rect(q.x, q.y, q.w, q.h));
  PCBL.vias.forEach((v) => { x.fillStyle = '#e0b840'; x.beginPath(); x.arc(X(v[0]), Y(v[1]), 0.45 * S, 0, 7); x.fill(); x.fillStyle = '#143'; x.beginPath(); x.arc(X(v[0]), Y(v[1]), 0.2 * S, 0, 7); x.fill(); });
}

// ------------------------------------------------------------------ part builders
const BUILD = {
  box: (p) => box(...p.size, p.build.color),

  breadboard: (p) => {
    const g = new THREE.Group();
    g.add(box(BB.w, BB.h, BB.d, '#e7e3d6'));
    const S = 14, W = Math.round(BB.w * S), H = Math.round(BB.d * S);
    const px = (x) => (x + BB.w / 2) * S, pz = (z) => (z + BB.d / 2) * S;
    const tex = canvasTex(W, H, (x) => {
      x.fillStyle = '#ece9de'; x.fillRect(0, 0, W, H);
      x.fillStyle = '#cdc9bb'; x.fillRect(0, pz(-2.4), W, 4.8 * S);
      x.fillStyle = '#c0392b'; x.fillRect(px(-37), pz(-26.3), 74 * S, 0.5 * S); x.fillRect(px(-37), pz(-20.4), 74 * S, 0.0);
      x.fillStyle = '#2e6bd1'; x.fillRect(px(-37), pz(26.0), 74 * S, 0.5 * S);
      x.fillStyle = '#2b2b2b';
      const sq = (cx, cz) => x.fillRect(px(cx) - 0.5 * S, pz(cz) - 0.5 * S, 1.0 * S, 1.0 * S);
      for (let c = 0; c < 30; c++) 'abcdefghij'.split('').forEach((r) => { const [hx, hz] = hole(c, r); sq(hx, hz); });
      for (let c = 0; c < 30; c++) if (c % 6 !== 5) [-24.77, -22.23, 22.23, 24.77].forEach((z) => sq((c - 14.5) * P, z));
      x.fillStyle = '#555'; x.font = `bold ${1.3 * S}px Inter, system-ui, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
      for (let c = 0; c < 30; c++) { const lab = String(c + 1); x.fillText(lab, px((c - 14.5) * P), pz(-16.6)); x.fillText(lab, px((c - 14.5) * P), pz(16.6)); }

  picoBoard: (p) => {
    const [L, T, W] = p.size; const g = new THREE.Group();
    g.add(box(L, T, W, '#17803f', { r: 0.45 }));
    const S = 22, wpx = Math.round(L * S), hpx = Math.round(W * S);
    const u = (x) => (x + L / 2) * S, v = (z) => (z + W / 2) * S;
    const left = ['GP0', 'GP1', 'GND', 'GP2', 'GP3', 'GP4', 'GP5', 'GND', 'GP6', 'GP7', 'GP8', 'GP9', 'GND', 'GP10', 'GP11', 'GP12', 'GP13', 'GND', 'GP14', 'GP15'];
    const right = ['GP16', 'GP17', 'GND', 'GP18', 'GP19', 'GP20', 'GP21', 'GND', 'GP22', 'RUN', 'GP26', 'GP27', 'GND', 'GP28', 'VREF', '3V3', '3V3_EN', 'GND', 'VSYS', 'VBUS'];
    const tex = canvasTex(wpx, hpx, (x) => {
      x.clearRect(0, 0, wpx, hpx);
      [[-3.9 + 0, 0]].length;
      // mounting holes
      [[-23.5, -5.7], [-23.5, 5.7], [23.5, -5.7], [23.5, 5.7]].forEach(([hx, hz]) => { x.fillStyle = '#d4af37'; x.beginPath(); x.arc(u(hx), v(hz), 1.5 * S, 0, 7); x.fill(); x.fillStyle = '#111'; x.beginPath(); x.arc(u(hx), v(hz), 1.05 * S, 0, 7); x.fill(); });
      const pin = (px_, pz_, hi) => {
        if (hi) { x.fillStyle = hi; x.beginPath(); x.arc(u(px_), v(pz_), 1.45 * S, 0, 7); x.fill(); }
        x.fillStyle = '#d4af37'; x.beginPath(); x.arc(u(px_), v(pz_), 0.9 * S, 0, 7); x.fill(); x.fillStyle = '#111'; x.beginPath(); x.arc(u(px_), v(pz_), 0.45 * S, 0, 7); x.fill();
      };
      x.font = `bold ${1.35 * S}px Inter, system-ui, sans-serif`; x.textBaseline = 'middle';
      for (let i = 0; i < 20; i++) {
        const px_ = -24.13 + i * P;
        const hiL = i === 19 ? '#ff7a00' : i === 17 ? '#222222' : null; // pin 20 (GP15) orange, pin 18 (GND) dark
        pin(px_, 8.89, hiL);
        pin(px_, -8.89, null);
        x.fillStyle = i === 19 ? '#ffd9a8' : '#ffffff';
        x.save(); x.translate(u(px_), v(7.2)); x.rotate(-Math.PI / 2); x.textAlign = 'left'; x.fillText(left[i], 0, 0); x.restore();
        x.fillStyle = '#ffffff';
        const j = 39 - i; // pin number 21..40 sits under pin 20..1
        x.save(); x.translate(u(px_), v(-7.2)); x.rotate(Math.PI / 2); x.textAlign = 'left'; x.fillText(right[19 - i], 0, 0); x.restore();
        void j;
      }
      // pin numbers 1 and 20 on the bottom row
      x.fillStyle = '#ffffff'; x.font = `bold ${1.1 * S}px Inter, system-ui, sans-serif`; x.textAlign = 'center';
      x.fillText('1', u(-24.13), v(10.0)); x.fillText('20', u(24.13 - 0), v(10.0));
    });
    const top = plane(tex, L, W, 'y'); top.position.y = T / 2 + 0.01; g.add(top);
    return g;

  <rect x="${X(0) - 4.4 * mmx}" y="${Y(-2.4)}" width="${BB.w * mmx}" height="${4.8 * mmx}" fill="#cdc9bb"/>`;

  // pico

  s += `<rect x="${pcx - pw / 2}" y="${Y(-10.5)}" width="${pw}" height="${ph}" rx="5" fill="#17803f" fill-opacity=".86" stroke="#0b4d25" stroke-width="2"/>

  <text x="${pcx - pw / 2 + 4}" y="${Y(0) + 4}" font-size="12" fill="#fff" font-weight="700" transform="rotate(-90 ${pcx - pw / 2 + 4} ${Y(0)})" text-anchor="middle">USB</text>
  <text x="${pcx + 30}" y="${Y(0) + 5}" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Raspberry Pi Pico 2 WH</text>`;
  const left = ['GP0', 'GP1', 'GND', 'GP2', 'GP3', 'GP4', 'GP5', 'GND', 'GP6', 'GP7', 'GP8', 'GP9', 'GND', 'GP10', 'GP11', 'GP12', 'GP13', 'GND', 'GP14', 'GP15'];

    s += `<text x="${hx(i)}" y="${hy('h') - 10}" font-size="9" fill="#fff" text-anchor="middle" transform="rotate(-90 ${hx(i)} ${hy('h') - 10})" text-anchor="start">${left[i]}</text>`;
  }

  s += `<rect x="${jx - 9.25 * mmx}" y="${Y(-27.5)}" width="${18.5 * mmx}" height="${14.8 * mmx}" fill="#b3262b" fill-opacity=".92" stroke="#6d1417" stroke-width="2"/>
